name: WalletDemo
options:
  bundleIdPrefix: com.swifttoolkits
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  SwiftToolkits:
    path: ../..
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0
targets:
  WalletDemo:
    type: application
    platform: iOS
    sources:
      - WalletDemo
    resources:
      - WalletDemo/Resources
    dependencies:
      - package: SwiftToolkits
        product: SwiftVault
      - package: SwiftToolkits
        product: SwiftWebviewBridge
      - package: SwiftToolkits
        product: SwiftDappConnect
      - package: SwiftToolkits
        product: SwiftWallet
      - package: SwiftToolkits
        product: SwiftNft
      - package: SwiftToolkits
        product: SwiftDid
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swifttoolkits.WalletDemo
        PRODUCT_NAME: WalletDemo
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        ENABLE_PREVIEWS: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
