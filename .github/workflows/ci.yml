name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-simulator-tests:
    name: iOS ${{ matrix.ios }} simulator tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主流 iOS 版本：当前版本 iOS 26 + 上一代主力 iOS 18
          - ios: '18'
            runner: macos-15
            device: iPhone 16
          - ios: '26'
            runner: macos-26
            device: iPhone 16e
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Make scripts executable
        run: chmod +x Scripts/*.sh

      - name: Build vendored Tink xcframework (skip if already vendored)
        # Tink.xcframework 已提交到仓库，checkout 后直接复用；
        # 仅当缺失时才触发 20+ 分钟的 Bazel 重建。
        run: SKIP_IF_EXISTS=1 ./Scripts/build_tink_xcframework.sh

      - name: Run iOS ${{ matrix.ios }} simulator tests with coverage (fastlane + xcov)
        run: bundle exec fastlane ios_test "device_name:${{ matrix.device }}" device_os:${{ matrix.ios }}

      - name: Locate .xcresult for Codecov
        run: |
          XCRESULT_PATH="$(ls -d .build/DerivedData/ios-coverage/Logs/Test/*.xcresult | head -n 1)"
          echo "XCRESULT_PATH=$XCRESULT_PATH" >> "$GITHUB_ENV"
          echo "Found $XCRESULT_PATH"

      - name: Convert .xcresult to lcov
        uses: stanfordbdhg/xccov2lcov@main
        with:
          xcresult: ${{ env.XCRESULT_PATH }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: info.lcov
          flags: ios${{ matrix.ios }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios-${{ matrix.ios }}
          path: coverage/ios/
