name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  ios-simulator-tests:
    name: iOS ${{ matrix.ios }} simulator tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 主流 iOS 版本：当前版本 iOS 26 + 上一代主力 iOS 18
          - ios: '18'
            runner: macos-15
            device: iPhone 16
          - ios: '26'
            runner: macos-26
            device: iPhone 16e
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 (Swift 6.2) on macos-15
        # macos-15 默认 Xcode 16.4 只带 Swift 6.1，而 Package.swift 要求 6.2；
        # 镜像上同时装有 Xcode 26.x（Swift 6.2）和 iOS 18.x 模拟器运行时，
        # 切到 Xcode 26 后即可在 iOS 18 模拟器上正常测试。
        if: matrix.ios == '18'
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | tail -n 1)"
          if [[ -z "$XCODE_PATH" ]]; then
            echo "::error::Xcode 26 not found on runner; Package.swift requires Swift tools 6.2"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Make scripts executable
        run: chmod +x Scripts/*.sh

      - name: Build vendored Tink xcframework (skip if already vendored)
        # Tink.xcframework 已提交到仓库，checkout 后直接复用；
        # 仅当缺失时才触发 20+ 分钟的 Bazel 重建。
        run: SKIP_IF_EXISTS=1 ./Scripts/build_tink_xcframework.sh

      - name: Run iOS ${{ matrix.ios }} simulator tests with coverage (fastlane + xcov)
        run: bundle exec fastlane ios_test "device_name:${{ matrix.device }}" device_os:${{ matrix.ios }}

      - name: Dump xcresult test failures (on failure)
        # xcodebuild -quiet 只在日志里留一句 "TEST FAILED"，
        # 真正的断言/超时详情在 .xcresult 里；失败时导出，便于直接定位。
        if: failure()
        run: |
          XCRESULT_PATH="$(ls -d .build/DerivedData/ios-coverage/Logs/Test/*.xcresult 2>/dev/null | head -n 1)"
          if [[ -z "$XCRESULT_PATH" ]]; then
            echo "No .xcresult found; skipping dump"
            exit 0
          fi
          echo "=== Test results summary ==="
          xcrun xcresulttool get test-results summary --path "$XCRESULT_PATH" || true
          echo "=== Failing tests details ==="
          xcrun xcresulttool get test-results tests --path "$XCRESULT_PATH" | head -c 20000 || true

      - name: Locate .xcresult for Codecov
        run: |
          XCRESULT_PATH="$(ls -d .build/DerivedData/ios-coverage/Logs/Test/*.xcresult | head -n 1)"
          echo "XCRESULT_PATH=$XCRESULT_PATH" >> "$GITHUB_ENV"
          echo "Found $XCRESULT_PATH"

      - name: Convert .xcresult to lcov
        uses: stanfordbdhg/xccov2lcov@main
        with:
          xcresult: ${{ env.XCRESULT_PATH }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: info.lcov
          flags: ios${{ matrix.ios }}
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios-${{ matrix.ios }}
          path: coverage/ios/
